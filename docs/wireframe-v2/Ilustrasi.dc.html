    const names = ['istana','sumpah','kabinet','sidang','meja','demo','banjir','pasar','pelabuhan','kunjungan','fiskal','sosial','energi','tatakelola'];
    const is = {}; names.forEach((n) => { is[n] = n === scene; });
    const labels = { istana: 'Istana pada malam hari dijaga dua pengawal', sumpah: 'Presiden mengangkat tangan di atas kitab saat pelantikan', kabinet: 'Rapat kabinet di meja panjang', sidang: 'Ruang sidang parlemen, sebagian anggota mengangkat kartu suara', meja: 'Meja kerja presiden di malam hari', demo: 'Massa membawa spanduk di depan barisan aparat', banjir: 'Permukiman tergenang banjir dan perahu karet', pasar: 'Pedagang dan pembeli di pasar', pelabuhan: 'Kapal peti kemas dan derek di pelabuhan', kunjungan: 'Presiden berjabat tangan dengan petani saat kunjungan daerah', fiskal: 'Dokumen anggaran, tumpukan koin, dan mesin hitung', sosial: 'Antrean pembagian bantuan sosial', energi: 'Kilang, menara listrik, dan turbin angin', tatakelola: 'Rak arsip, loket layanan, dan stempel' };
    const stripes = Array.from({ length: 16 }, (_, i) => 20 + i * 40);
    const heads = [];
    [[300, 278], [230, 208], [160, 138]].forEach(([rx, ry], row) => {
      const n = 9 - row * 2 + 4;
      for (let i = 0; i < n; i++) {
        const a = Math.PI - ((i + 0.5) / n) * Math.PI;
        heads.push({ cx: (380 + rx * Math.cos(a)).toFixed(0), cy: (640 - ry * Math.sin(a) - 16).toFixed(0), fill: (i + row) % 4 === 0 ? '#787878' : '#2B2522', card: (i * 7 + row * 3) % 5 < 2 });
      }
    });
    const police = Array.from({ length: 12 }, (_, i) => ({ x: 20 + i * 62 }));
    const bodies = ['#D86018', '#181A1F', '#ECEAE4', '#3A3C56', '#C03018', '#D86018'];
    const crowd = [];
    [[400, 0], [470, 50], [540, 0]].forEach(([y, off], r) => {
      for (let i = 0; i < 7; i++) { const x = off + i * 112 - 30; crowd.push({ x, y, hx: x + 48, body: bodies[(i + r * 2) % bodies.length] }); }
    });
    const awning = Array.from({ length: 8 }, (_, i) => ({ x: i * 95, fill: i % 2 ? '#ECEAE4' : '#C03018' }));
    const cf = ['#D86018', '#C03018', '#3A3C56', '#C9A227'];
    const containers = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) containers.push({ x: 60 + c * 98, y: 352 - r * 48, fill: cf[(r + c * 3) % 4] });
    const coins = [{ x: 380, y: 420, h: 120, cx: 435 }, { x: 500, y: 460, h: 80, cx: 555 }, { x: 620, y: 400, h: 140, cx: 675 }];
    const keys = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) keys.push({ x: 506 + c * 52, y: 176 + r * 38, fill: r === 3 && c === 2 ? '#C9A227' : '#D8D8C0' });
    const bf = ['#C03018', '#181830', '#C9A227', '#D86018', '#ECEAE4', '#3A3C56'];
    const binders = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) if ((c + r) % 5 !== 4) binders.push({ x: 56 + c * 34, y: 52 + r * 120, fill: bf[(c * 2 + r) % 6] });
    return { is, label: labels[scene], tinggi: this.props.tinggi ?? '640px', stripes, heads, police, crowd, awning, containers, coins, keys, binders };
  }
}
</script>
