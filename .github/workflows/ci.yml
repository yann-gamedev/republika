name: Stage 1 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:check
      - run: pnpm build:web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  desktop:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --filter @republika/desktop exec tauri build --ci
      - name: Installer size
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -eq 0) { throw 'Installer NSIS tidak ditemukan.' }
          foreach ($installer in $installers) {
            $mib = [math]::Round($installer.Length / 1MB, 2)
            "$($installer.Name): $($installer.Length) bytes ($mib MiB)" >> $env:GITHUB_STEP_SUMMARY
            if ($installer.Length -gt 15MB) { throw 'Installer melampaui batas 15 MiB.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: republika-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
