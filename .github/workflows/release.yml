name: Release

# Dipicu oleh tag v* (mis. v0.1.0-rc.1). Membuat DRAFT GitHub Release berisi
# installer NSIS, checksum SHA-256, dan catatan dari CHANGELOG.md. Draft perlu
# dipublikasikan manual oleh pemilik proyek setelah diperiksa.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag yang sudah ada (mis. v0.1.0-rc.1)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile

      - name: Versi tag sama dengan package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG tidak cocok dengan versi package.json v$version. Jalankan pnpm version:set." }

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:check
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --filter @republika/desktop exec tauri build --ci

      - name: Installer, checksum, dan catatan rilis
        id: assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'Installer NSIS tidak ditemukan.' }
          if ($installer.Length -gt 15MB) { throw 'Installer melampaui batas 15 MiB.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii "$($installer.FullName).sha256"
          $version = $env:TAG.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          $section = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "Lihat CHANGELOG.md." }
          @(
            $section,
            '',
            '### Instal',
            'Unduh `' + $installer.Name + '`, jalankan, lalu ikuti petunjuk. Installer belum ditandatangani: bila Windows SmartScreen muncul, klik **More info → Run anyway**. Panduan lengkap ada di README.',
            '',
            '### Checksum SHA-256',
            '```',
            "$hash  $($installer.Name)",
            '```'
          ) | Out-File -Encoding utf8 release-notes.md
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--draft', '--title', "REPUBLIKA $env:TAG", '--notes-file', 'release-notes.md')
          if ('${{ steps.assets.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $env:TAG @flags '${{ steps.assets.outputs.installer }}' '${{ steps.assets.outputs.installer }}.sha256'
